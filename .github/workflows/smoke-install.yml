name: Smoke Install

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  smoke-install:
    name: Node 22 · ${{ matrix.pm }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        pm: ['npm', 'pnpm']

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build package
        run: pnpm build

      - name: Create tarball
        id: pack
        run: |
          PKG_TGZ="$(npm pack --silent | tail -n 1)"
          echo "tgz=$PKG_TGZ" >> "$GITHUB_OUTPUT"

      - name: Smoke install via npm
        if: matrix.pm == 'npm'
        run: |
          TMP_DIR="$(mktemp -d)"
          cd "$TMP_DIR"
          npm init -y >/dev/null
          npm i "$GITHUB_WORKSPACE/${{ steps.pack.outputs.tgz }}"
          npx --no-install coderecall --version

      - name: Smoke install via pnpm
        if: matrix.pm == 'pnpm'
        run: |
          TMP_DIR="$(mktemp -d)"
          cd "$TMP_DIR"
          npm init -y >/dev/null
          # pnpm 11 不读 package.json 的 pnpm 字段，未放行的安装脚本会直接失败
          cat > pnpm-workspace.yaml <<'EOF'
          allowBuilds:
            "@alistar.max/coderecall": true
            better-sqlite3: true
            onnxruntime-node: true
            protobufjs: true
            tree-sitter: true
            tree-sitter-go: true
            tree-sitter-javascript: true
            tree-sitter-python: true
          EOF
          pnpm add "$GITHUB_WORKSPACE/${{ steps.pack.outputs.tgz }}"
          pnpm exec coderecall --version
