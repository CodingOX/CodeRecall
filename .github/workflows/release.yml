name: Release

on:
  push:
    branches: [main]
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: '可选。指定版本（如 0.2.0）。留空则从最新 main 自动递增 patch'
        required: false
        type: string

permissions:
  contents: write
  id-token: write

concurrency:
  group: release-${{ github.repository }}
  cancel-in-progress: false

jobs:
  build-and-publish:
    name: Build and Publish
    # 版本号提交若被个人令牌再次推上 main，不要连跳两个 patch
    if: github.event_name != 'push' || github.ref_type == 'tag' || !startsWith(github.event.head_commit.message, 'chore(release):')
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout latest code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.ref_type == 'tag' && github.ref || 'main' }}

      - name: Resolve release version
        id: rel
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          set -euo pipefail
          CURRENT="$(node -p "require('./package.json').version")"

          if [ "$REF_TYPE" = "tag" ]; then
            VER="${GITHUB_REF_NAME#v}"
          elif [ -n "${INPUT_VERSION}" ]; then
            VER="${INPUT_VERSION#v}"
            node scripts/bump-package-versions.js "$VER" >/dev/null
          elif git rev-parse -q --verify "refs/tags/v${CURRENT}" >/dev/null; then
            VER="$(node scripts/bump-package-versions.js)"
          else
            VER="$CURRENT"
          fi

          echo "tag=v${VER}" >> "$GITHUB_OUTPUT"
          echo "ver=${VER}" >> "$GITHUB_OUTPUT"

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          registry-url: 'https://registry.npmjs.org'
          cache: pnpm

      - name: Upgrade npm for provenance publishing
        run: |
          npm i -g npm@^11.5.1
          npm -v
          node -v
          pnpm -v

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run tests
        run: pnpm test

      - name: Build all packages (plugins first, then lang-all)
        run: |
          pnpm build
          pnpm -r --filter='!./packages/lang-all' build
          pnpm --filter='./packages/lang-all' build

      - name: Verify versions match tag
        run: |
          VER="${{ steps.rel.outputs.ver }}"
          node - <<'NODE'
          const fs = require('fs');
          const ver = process.env.VER;
          const files = [
            ['@alistar.max/coderecall', 'package.json'],
            ['@alistar.max/coderecall-lang-typescript', 'packages/lang-typescript/package.json'],
            ['@alistar.max/coderecall-lang-kotlin', 'packages/lang-kotlin/package.json'],
            ['@alistar.max/coderecall-lang-csharp', 'packages/lang-csharp/package.json'],
            ['@alistar.max/coderecall-lang-cpp', 'packages/lang-cpp/package.json'],
            ['@alistar.max/coderecall-lang-java', 'packages/lang-java/package.json'],
            ['@alistar.max/coderecall-lang-ruby', 'packages/lang-ruby/package.json'],
            ['@alistar.max/coderecall-lang-c', 'packages/lang-c/package.json'],
            ['@alistar.max/coderecall-lang-php', 'packages/lang-php/package.json'],
            ['@alistar.max/coderecall-lang-rust', 'packages/lang-rust/package.json'],
            ['@alistar.max/coderecall-lang-swift', 'packages/lang-swift/package.json'],
            ['@alistar.max/coderecall-lang-all', 'packages/lang-all/package.json'],
          ];
          let ok = true;
          for (const [name, file] of files) {
            const pkg = JSON.parse(fs.readFileSync(file, 'utf8'));
            if (pkg.version !== ver) {
              console.error(`${name} version mismatch: ${pkg.version} != ${ver}`);
              ok = false;
            }
          }
          if (!ok) process.exit(1);
          NODE
        env:
          VER: ${{ steps.rel.outputs.ver }}

      - name: Publish packages (plugins first, then main)
        run: |
          set -euo pipefail
          VER="${{ steps.rel.outputs.ver }}"

          PACKAGE_NAMES=(
            "@alistar.max/coderecall-lang-typescript"
            "@alistar.max/coderecall-lang-kotlin"
            "@alistar.max/coderecall-lang-csharp"
            "@alistar.max/coderecall-lang-cpp"
            "@alistar.max/coderecall-lang-java"
            "@alistar.max/coderecall-lang-ruby"
            "@alistar.max/coderecall-lang-c"
            "@alistar.max/coderecall-lang-php"
            "@alistar.max/coderecall-lang-rust"
            "@alistar.max/coderecall-lang-swift"
            "@alistar.max/coderecall-lang-all"
            "@alistar.max/coderecall"
          )

          echo "Preflight: verify npm publish identity"
          npm whoami

          for pkg in "${PACKAGE_NAMES[@]}"; do
            if npm view "$pkg@$VER" version >/dev/null 2>&1; then
              echo "Preflight: $pkg@$VER already exists"
              continue
            fi

            echo "Preflight: $pkg@$VER is not published yet"
          done

          publish_if_needed() {
            local PKG="$1"
            local DIR="$2"

            if npm view "$PKG@$VER" version >/dev/null 2>&1; then
              echo "Skip publish: $PKG@$VER already exists"
              return 0
            fi

            echo "Publishing $PKG@$VER from $DIR"
            if [ "$DIR" = "." ]; then
              npm publish --access public --provenance
            else
              (
                cd "$DIR"
                npm publish --access public --provenance
              )
            fi
          }

          publish_if_needed "@alistar.max/coderecall-lang-typescript" "packages/lang-typescript"
          publish_if_needed "@alistar.max/coderecall-lang-kotlin" "packages/lang-kotlin"
          publish_if_needed "@alistar.max/coderecall-lang-csharp" "packages/lang-csharp"
          publish_if_needed "@alistar.max/coderecall-lang-cpp" "packages/lang-cpp"
          publish_if_needed "@alistar.max/coderecall-lang-java" "packages/lang-java"
          publish_if_needed "@alistar.max/coderecall-lang-ruby" "packages/lang-ruby"
          publish_if_needed "@alistar.max/coderecall-lang-c" "packages/lang-c"
          publish_if_needed "@alistar.max/coderecall-lang-php" "packages/lang-php"
          publish_if_needed "@alistar.max/coderecall-lang-rust" "packages/lang-rust"
          publish_if_needed "@alistar.max/coderecall-lang-swift" "packages/lang-swift"
          publish_if_needed "@alistar.max/coderecall-lang-all" "packages/lang-all"

          publish_if_needed "@alistar.max/coderecall" "."
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Commit version bump and push tag
        env:
          TAG: ${{ steps.rel.outputs.tag }}
          VER: ${{ steps.rel.outputs.ver }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if ! git diff --quiet; then
            git add -- package.json packages/lang-all/package.json packages/lang-c/package.json packages/lang-cpp/package.json packages/lang-csharp/package.json packages/lang-java/package.json packages/lang-kotlin/package.json packages/lang-php/package.json packages/lang-ruby/package.json packages/lang-rust/package.json packages/lang-swift/package.json packages/lang-typescript/package.json
            git commit -m "chore(release): bump packages to ${VER}"
            git push origin HEAD:main
          fi

          if git rev-parse -q --verify "refs/tags/${TAG}" >/dev/null; then
            echo "Tag ${TAG} already exists"
          else
            git tag "$TAG"
            git push origin "$TAG"
          fi

      - name: Create GitHub Release
        if: startsWith(steps.rel.outputs.tag, 'v')
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.rel.outputs.tag }}
          generate_release_notes: true
          draft: false
          prerelease: false
          body: |
            ## 🚀 CodeRecall ${{ steps.rel.outputs.tag }}

            ### 版本亮点
            - 支持 Node.js 20 / 22 / 24（Node 要求：`>=20 <25`，推荐 Node 22 LTS）
            - 主包默认内置 JavaScript / Python / Go 的 AST 分片能力
            - TypeScript / Kotlin / Java / Rust 提升为默认核心支持
            - C / C++ / C# / PHP / Ruby / Swift 继续通过按需插件增强

            ### 安装主包
            ```bash
            npm install -g @alistar.max/coderecall
            # 或
            pnpm add -g @alistar.max/coderecall
            ```

            ### 按需安装（示例）
            ```bash
            npm install -g @alistar.max/coderecall-lang-csharp
            npm install -g @alistar.max/coderecall-lang-swift
            ```

            > `lang-ts21` / `lang-ts22` 历史兼容包已移除；请使用主包默认核心支持或对应单语言插件。
            > 未安装插件时会自动回退到纯文本分片，不阻断索引流程。
