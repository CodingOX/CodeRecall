packages:
  - 'packages/*'

# pnpm 11 将 workspace 链接配置从 .npmrc 迁移至 pnpm-workspace.yaml，确保语义化版本依赖本地包
linkWorkspacePackages: true
preferWorkspacePackages: true

# pnpm 11 不再读取 package.json 的 pnpm.onlyBuiltDependencies，原生模块在这里放行。
allowBuilds:
  better-sqlite3: true
  esbuild: true
  onnxruntime-node: true
  protobufjs: true
  tree-sitter: true
  tree-sitter-c: true
  tree-sitter-c-sharp: true
  tree-sitter-cli: true
  tree-sitter-cpp: true
  tree-sitter-go: true
  tree-sitter-java: true
  tree-sitter-javascript: true
  tree-sitter-kotlin: true
  tree-sitter-php: true
  tree-sitter-python: true
  tree-sitter-ruby: true
  tree-sitter-rust: true
  tree-sitter-swift: true
  tree-sitter-typescript: true
